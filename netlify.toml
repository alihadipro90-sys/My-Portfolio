# ============================================================
# Netlify Configuration
# Muhammad Hadi Portfolio
# React + Vite + Tailwind CSS
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

# ============================================================
# SPA REDIRECT
# Allows React Router / client-side routes to work correctly
# ============================================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# SECURITY HEADERS
# ============================================================

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ============================================================
# STATIC ASSETS
# Long-term caching for Vite-generated assets
# ============================================================

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# FAVICON
# ============================================================

[[headers]]
  for = "/favicon.ico"

  [headers.values]
    Cache-Control = "public, max-age=86400"

# ============================================================
# ROBOTS.TXT
# ============================================================

[[headers]]
  for = "/robots.txt"

  [headers.values]
    Content-Type = "text/plain"

# ============================================================
# SITEMAP
# ============================================================

[[headers]]
  for = "/sitemap.xml"

  [headers.values]
    Content-Type = "application/xml"

# ============================================================
# OPTIONAL: ENVIRONMENT-SPECIFIC BUILD
# ============================================================

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
